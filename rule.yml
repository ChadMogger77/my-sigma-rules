title: Absolute Disregard for Local Network Defenses
id: da8b1f4c-81b3-4f9a-9cb8-b21a0d34f1a2
status: stable
description: Detects command-line attempts to completely disable the Windows Firewall.
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains: 'state off'
    keywords:
        CommandLine|contains:
            - 'netsh'
            - 'advfirewall'
    condition: selection and keywords
falsepositives:
    - None. Even in testing environments, this should be flagged.
level: critical